{% extends 'reviewApp/base.html' %}

{% block title %}All Movies{% endblock %}

{% block content %}
  <h2>All Movies</h2>
  <div class="row">
    {% for movie in movies %}
      <div class="col-md-4 mb-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{ movie.movie_title }}</h5>
            <p>Average Score: {{ movie.avg_score|floatformat:2 }}</p>
            <a href="{% url 'movie_reviews' movie.movie_title %}" class="btn btn-primary">View Reviews</a>
          </div>
        </div>
      </div>
    {% empty %}
      <p>No movies found.</p>
    {% endfor %}
  </div>
{% endblock %}
